services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      # 口令从项目根 .env 注入（compose 自动加载）；仅首次初始化数据卷时生效。
      # 注意：postgres 镜像入口脚本只认 POSTGRES_PASSWORD 这个名字
      #（POSTGRES_PASS 是应用侧读的变量名，两个都写在 .env 里，别混用）
      - POSTGRES_PASSWORD=${POSTGRES_PASS:?请在项目根 .env 中设置 POSTGRES_PASSWORD}
      - POSTGRES_USER=root
      - POSTGRES_DB=scs
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /data/postgres/data:/var/lib/postgresql/data/pgdata:Z
    healthcheck:
      # 显式指定业务库：pg_isready 默认拿用户名当库名，会每 10s 刷一条 FATAL 噪音
      test: ["CMD-SHELL", "pg_isready -U root -d scs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # E2EE 用户服务缓存层（决策 B11）：会话热读缓存 + 限流计数；
  # AOF 持久化保证限流计数等缓存数据重启不丢；Postgres 仍是会话唯一事实源
  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /data/redis/data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  lavinmq:
    image: docker.io/cloudamqp/lavinmq:latest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - /data/lavinmq/data:/var/lib/lavinmq:Z
      # control socket 共享给 lavinmq-init 建号用（本地 unix socket，不经网络）
      - lavinmq-ctl:/tmp
    healthcheck:
      test: ["CMD", "lavinmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一次性初始化容器：经 control socket（共享卷，不经网络、无需凭据）把 .env 的
  # RABBIT_* 账号建进 LavinMQ 并授权。幂等：账号已存在时 add_user 直接成功，
  # change_password 保证改密后重新 compose up 即同步。默认 guest 仅限回环连接，
  # 容器网络远程连入必须用专用账号；monitoring tag 供 app 巡检查 /api/queues。
  # 注意：LavinMQ 不读环境变量（LAVINMQ_ADMIN_* 之类无效），镜像默认账号口令
  # 只能在启动参数里给哈希且仅首次初始化生效，故用本容器在启动后建号
  lavinmq-init:
    image: cloudamqp/lavinmq:latest
    depends_on:
      lavinmq:
        condition: service_healthy
    volumes:
      - lavinmq-ctl:/tmp
    entrypoint:
      - /bin/sh
      - -c
      - >-
        lavinmqctl add_user "${RABBIT_USER:-scs}" "${RABBIT_PASS:?未设置 RABBIT_PASS}" &&
        lavinmqctl change_password "${RABBIT_USER:-scs}" "${RABBIT_PASS:?未设置 RABBIT_PASS}" &&
        lavinmqctl set_permissions "${RABBIT_USER:-scs}" '.*' '.*' '.*' &&
        lavinmqctl set_user_tags "${RABBIT_USER:-scs}" monitoring

  # 应用本体（CI 推送的 GraalVM Native 镜像）。.env 经 env_file 全量注入容器：
  # GEMINI_API_KEY、GROQ_API_KEY、AZURE_OCR_API_KEY、OCRSPACE_API_KEY、SMTP_*、
  # CRAWLER_ADMIN_TOKEN 等直接写 .env 即可（Spring 宽松绑定也能覆盖任意配置项）；
  # 另有三个 compose 变量：APP_PORT（宿主端口）、APP_IMAGE_TAG（镜像 tag）、
  # APP_ARGS（附加启动参数，空格分隔）。
  app:
    image: ghcr.io/loveheng/stock-calculator-service:${APP_IMAGE_TAG:-1942570}
    ports:
      - "${APP_PORT:-18080}:18080"
    env_file:
      - .env
    # 启动参数：.env 中 APP_ARGS=--crawler.enabled=false 即可追加程序参数
    entrypoint: ["/bin/sh", "-c", "exec /application/stock-calculator-service $$APP_ARGS"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lavinmq:
        condition: service_healthy
    restart: unless-stopped

  # 数据服务（CI 推送的 GraalVM Native 镜像，镜像名 = 主镜像 + -data 后缀）。
  # 无 JPA 数据源，不连 postgres，只依赖 LavinMQ；collector/worker/ingest 三角色
  # 已在镜像内 AOT 钉死（all-in-one），运行期不可切换。worker 的 CLOUDFLARE_*、
  # 蒸馏 LLM 的 LLM_*、ingest 的 INGEST_SECRET、RABBIT_* 连接拓扑经 env_file 从 .env 注入。
  data:
    image: ghcr.io/loveheng/stock-calculator-service-data:${DATA_IMAGE_TAG:-3a4f486}
    ports:
      - "${DATA_PORT:-18081}:8080"   # 仅 ingest webhook 使用，不用 ingest 可注释掉
    env_file:
      - .env
    depends_on:
      lavinmq:
        condition: service_healthy
    restart: unless-stopped

  # 数据服务 worker 变体（多副本扩容用）：collector/ingest 已在镜像内 AOT 裁剪，
  # 仅剩 worker 两域（公告蒸馏 + 向量化）竞争消费任务队列，无 HTTP 端口。
  # profile 门控：主机 1 compose up 默认不激活；新机器上复制本 compose + .env，
  # RABBIT_HOST 指向主机 1 的虚拟网地址后 --profile data-worker 启动。
  # 每副本不同 key：CLOUDFLARE_* / LLM_* 是运行期值，改各副本 env 即可
  # （同机多副本不同 key 用多个 service 块或 podman run --env-file）。
  # 详见 docs/data-worker-replica-deploy.md
  data-worker:
    image: ghcr.io/loveheng/stock-calculator-service-data-worker:${DATA_IMAGE_TAG:-3a4f486}
    env_file:
      - .env
    # 公告 worker 并发消费者数（默认 1；值非 AOT 条件可运行期覆盖）。
    # 2~3 并发注意 PDF RSS 峰值，mem_limit 2g 即按此估算
    # environment:
    #   DATASVC_WORKER_PREFETCH_ANNOUNCEMENTCONCURRENCY: 2
    mem_limit: 2g
    restart: unless-stopped
    profiles: ["data-worker"]

  frontend:
    # 如果已推送到镜像仓库用 image，若是本地构建可用 build: ./frontend
    image: ghcr.io/loveheng/stock-calculator:${FRONTEND_IMAGE_TAG:-sha-50ce249}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  # 共享给 lavinmq-init 的 LavinMQ control socket（/tmp/lavinmqctl.sock）
  lavinmq-ctl:
