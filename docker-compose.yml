services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      # 口令从项目根 .env 注入（compose 自动加载）；仅首次初始化数据卷时生效
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在项目根 .env 中设置 POSTGRES_PASSWORD}
      - POSTGRES_USER=root
      - POSTGRES_DB=scs
    volumes:
      - /data/postgres/data:/var/lib/postgresql:Z
