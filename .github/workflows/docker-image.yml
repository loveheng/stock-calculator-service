name: Build and Push Docker Image for Stock Calculator Service

on:
  push:
    branches: [ "main", "master" ]   # 监听主分支代码推送
    tags: [ 'v*.*.*' ]               # 监听版本标签发布 (如 v1.0.0)

env:
  REGISTRY: ghcr.io
  # 统一转为小写镜像名：ghcr.io/your-username/stock-calculator-service
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 核心新增步骤 1：安装 GraalVM 21 并开启 Maven 依赖缓存
      # ---------------------------------------------------------
      - name: 配置 GraalVM JDK 21 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      # ---------------------------------------------------------
      # 核心新增步骤 2：在宿主机直接执行 Native AOT 原生编译
      # ---------------------------------------------------------
      - name: 编译 Native 二进制产物
        run: |
          mvn -Pnative package -DskipTests -Dfile.encoding=UTF-8

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 核心调整：仅将生成的单一二进制文件打包进极简 Alpine 镜像中
      # ---------------------------------------------------------
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max