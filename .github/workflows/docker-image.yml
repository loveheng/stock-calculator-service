name: Build and Push Docker Image for Stock Calculator Service

on:
  push:
    branches: [ "main", "master","native" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 1. 安全处理：将仓库名强制转为全小写，防止推送 GHCR 报错
      - name: 格式化镜像名称 (全小写)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 2. 配置 GraalVM JDK 21
      - name: 配置 GraalVM JDK 21 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      # 3. 编译 Native 原生二进制文件
      - name: 编译 Native 二进制产物
        run: |
          mvn -Pnative clean package -DskipTests -Dfile.encoding=UTF-8

      # 4. 登录 GHCR
      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 解析镜像 Tag 和 Labels
      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      # 6. 初始化 Docker Buildx
      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. 构建并推送 Docker 镜像
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max