name: Build and Push Docker Image for Stock Calculator Service

on:
  push:
    branches: [ "main", "master" ]   # 监听主分支代码推送
    tags: [ 'v*.*.*' ]               # 监听版本标签发布 (如 v1.0.0)

env:
  REGISTRY: ghcr.io
  # 统一转为小写镜像名：ghcr.io/your-username/stock-calculator-service
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 初始化 Docker Buildx (支持高级缓存)
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 单架构镜像通常部署在 amd64 服务器；如需多架构可改为 'linux/amd64,linux/arm64'
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启 GitHub Actions 缓存加速 Maven 依赖下载与编译层
          cache-from: type=gha
          cache-to: type=gha,mode=max