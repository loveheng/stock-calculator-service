# ============================================================================
# Stock Calculator Service — Native 镜像按需构建（main + data 双模块）
#
# 单仓三模块：stock-calculator-main（主服务）/ stock-calculator-data（数据服务），
# 共享依赖 stock-calculator-contract + 根 pom.xml + mvnw 包装器。
#
# 构建策略（按模块条件构建，避免每次推送全量编译）：
#   - 分支推送：dorny/paths-filter 按变更路径决定构建目标——
#       main 侧文件变更（或 contract/根 POM 等共享部分变更）→ 构建主服务镜像 ghcr.io/<repo>
#       data 侧文件变更（或共享部分变更）      → 构建数据服务镜像 ghcr.io/<repo>-data
#     两个 job 并行跑在各自 runner 上，互不拖慢；仅文档类变更则一个都不跑。
#   - tag 推送（发版）/ 手动触发：不受路径过滤，强制全量构建。
#     （on.push.paths 对 tag 推送不可靠——tag 事件没有可比较的文件变更，
#      故 tag 一律走 changes job 的强制全量分支，见下方 force 步骤。）
# ============================================================================

name: Build and Push Native Docker Images (per-module)

on:
  push:
    branches: [ "main", "dev", "native" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

# 同一分支/tag 连续推送时取消已过期的构建，节省 runner 时间
concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------- 变更检测：决定本次推送要构建哪些模块 ----------------
  # 两个检测步骤的 if 互斥且完备：分支推送走路径过滤；其余（tag/手动/未来
  # 可能加入的 pull_request）走强制全量。保证 outputs.main/data 恒有定义。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main: ${{ steps.filter.outputs.main }}
      data: ${{ steps.filter.outputs.data }}
      mcp: ${{ steps.filter.outputs.mcp }}
      notify: ${{ steps.filter.outputs.notify }}
      orchestration: ${{ steps.filter.outputs.orchestration }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检测变更模块 (dorny/paths-filter)
        id: filter
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: dorny/paths-filter@v3
        with:
          filters: |
            main:
              - 'stock-calculator-main/**'
              - 'stock-calculator-contract/**'
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - '.github/workflows/docker-image.yml'
            data:
              - 'stock-calculator-data/**'
              - 'stock-calculator-contract/**'
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - '.github/workflows/docker-image.yml'
            mcp:
              - 'stock-calculator-mcp/**'
              - 'stock-calculator-main/**'
              - 'stock-calculator-contract/**'
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - '.github/workflows/docker-image.yml'
            notify:
              - 'stock-calculator-mcp-notify/**'
              - 'stock-calculator-main/**'
              - 'stock-calculator-contract/**'
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - '.github/workflows/docker-image.yml'
            orchestration:
              - 'stock-calculator-orchestration/**'
              - 'stock-calculator-main/**'
              - 'stock-calculator-contract/**'
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - '.github/workflows/docker-image.yml'

      - name: tag 推送或手动触发 → 强制全量构建
        id: force
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "main=true" >> "$GITHUB_OUTPUT"
          echo "data=true" >> "$GITHUB_OUTPUT"
          echo "mcp=true" >> "$GITHUB_OUTPUT"
          echo "notify=true" >> "$GITHUB_OUTPUT"
          echo "orchestration=true" >> "$GITHUB_OUTPUT"

  # ---------------- 主服务镜像（原 docker-image 流程） ----------------
  # 镜像名保持 ghcr.io/<repo> 不变，docker-compose.yml / README 的引用无需改动。
  build-main:
    name: 构建主服务镜像 (main)
    needs: changes
    if: needs.changes.outputs.main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # build-native.sh 步骤 4 的启动测试需要真实连库，且不只是探测方言——
    # 启动期 watchdog @PostConstruct 会查 pull_task_config（空库直接 BeanCreation
    # 异常炸掉启动），schema 必须由下方「初始化数据库 schema」步骤预先灌入。
    # 用 pgvector 镜像与本地 docker-compose 的 postgres 同镜像同版本同账号
    # （裸 postgres 镜像没有 vector 扩展，schema.sql 的 CREATE EXTENSION 会失败）。
    # 口令经 POSTGRES_PASS 注入下方编译步骤（优先取 secrets.CI_POSTGRES_PASSWORD）。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
          POSTGRES_DB: scs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 初始化数据库 schema：应用启动时本会自建（classpath schema.sql/data.sql +
      #    spring.sql.init.mode=always，幂等），此步骤冗余但保留——SQL 错误在
      #    10 分钟 native-image 编译之前就失败，且冒烟起于已知 schema 状态。
      - name: 初始化数据库 schema
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
        run: |
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -f postgres/schema.sql
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -f postgres/data.sql

      # 3. 安全处理：将仓库名强制转为全小写，防止推送 GHCR 时大小写不合规报错
      - name: 格式化镜像名称 (全小写)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 4. 扩展 Runner 虚拟内存 (Swap Space)
      #    main 变体含 Spring AI 全家桶（173 jar），native-image 用 -J-Xmx12g，
      #    增加 8GB Swap 确保编译不 OOM。
      - name: 扩展虚拟内存 (Swap Space)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      # 5. 配置 GraalVM JDK 25 环境（含 native-image 组件）
      #    build-native.sh 会自动探测 JAVA_HOME（setup-graalvm 会设置）并校验 25.x 版本。
      #    cache: 'maven' 缓存 ~/.m2，加快父 POM + contract 的 install 与依赖下载。
      - name: 配置 GraalVM JDK 25 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: true

      # 6. 编译 Native 二进制 + 冒烟验证
      #    全部逻辑收敛在 build-native.sh（本地与 CI 走完全相同的路径）：
      #    install 父POM/contract -> mvnw compile + spring-boot:process-aot
      #    -> 生成 classpath 并剥离 test jar -> native-image -> 启动测试（失败即中止）
      - name: 编译 Native 二进制 (build-native.sh)
        env:
          POSTGRES_PASS: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
        run: bash stock-calculator-main/build-native.sh

      # 7. 登录 GitHub Container Registry (GHCR)
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. 解析镜像 Tag 和 Labels
      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      # 9. 初始化 Docker Buildx
      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 10. 构建并推送最小镜像（Dockerfile.native 在 main 模块目录内，
      #    context 必须同为该目录，才能 COPY 到模块 target/ 下的二进制）
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./stock-calculator-main
          file: ./stock-calculator-main/Dockerfile.native
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-native
          cache-to: type=gha,mode=max,scope=docker-native

  # ---------------- 数据服务镜像（data 模块，独立镜像名） ----------------
  # 与 build-main 同套路，差异点：
  #   - 镜像名加 -data 后缀（ghcr.io/<repo>-data），不与主服务镜像混用
  #   - 无 JPA 数据源：不需要 postgres service，冒烟凭据由脚本内 dummy 注入
  #   - GHA docker 缓存用独立 scope（docker-data），两镜像互不污染
  build-data:
    name: 构建数据服务镜像 (data)
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # data 变体为 all-in-one（collector/worker/ingest 三角色全开，AOT 期钉死），
      # native-image 同样 -J-Xmx12g，需要 8GB Swap 防编译 OOM
      - name: 扩展虚拟内存 (Swap Space)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: 配置 GraalVM JDK 25 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: true

      # data/build-native.sh 自含完整链路：install 父POM/contract -> compile+AOT
      # -> classpath 剥离 -> native-image -> 启动冒烟（ingest 端点探活，无需连库）
      - name: 编译 Native 二进制 (build-native.sh)
        run: bash stock-calculator-data/build-native.sh

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名 = 仓库全小写 + -data 后缀
      - name: 格式化镜像名称 (全小写)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-data" >> $GITHUB_ENV

      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./stock-calculator-data
          file: ./stock-calculator-data/Dockerfile.native
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-data
          cache-to: type=gha,mode=max,scope=docker-data

  # ---------------- MCP 经纪人镜像（:18081，依赖 main artifact，需 PG+Redis） ----------------
  # 与 build-main 同套路（同样连 stock_mcp 独立库做启动冒烟），差异点：
  #   - 镜像名加 -mcp 后缀（ghcr.io/<repo>-mcp）
  #   - pgvector service 预灌 mcp-schema.sql（sql.init 幂等，CI 冒烟起于已知状态）
  #   - GHA docker 缓存独立 scope（docker-mcp）
  build-mcp:
    name: 构建 MCP 服务镜像 (mcp)
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
          POSTGRES_DB: scs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化数据库 schema
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
        run: |
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -f postgres/schema.sql
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -f postgres/data.sql
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -c 'CREATE DATABASE stock_mcp OWNER root'
          psql -h 127.0.0.1 -U root -d stock_mcp -v ON_ERROR_STOP=1 -f stock-calculator-mcp/src/main/resources/mcp-schema.sql

      - name: 扩展虚拟内存 (Swap Space)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: 配置 GraalVM JDK 25 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: true

      - name: 编译 Native 二进制 (build-native.sh)
        env:
          POSTGRES_PASS: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
        run: bash stock-calculator-mcp/build-native.sh

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 格式化镜像名称 (全小写)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-mcp" >> $GITHUB_ENV

      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./stock-calculator-mcp
          file: ./stock-calculator-mcp/Dockerfile.native
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-mcp
          cache-to: type=gha,mode=max,scope=docker-mcp

  # ---------------- Notify 提醒服务镜像（:18082，依赖 main artifact，需 PG） ----------------
  # 与 build-mcp 同套路（reminder 表复用 stock_mcp 库，N3），差异点：
  #   - 镜像名加 -notify 后缀（ghcr.io/<repo>-notify）
  #   - GHA docker 缓存独立 scope（docker-notify）
  build-notify:
    name: 构建 Notify 服务镜像 (notify)
    needs: changes
    if: needs.changes.outputs.notify == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
          POSTGRES_DB: scs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化数据库 schema
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
        run: |
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -f postgres/schema.sql
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -f postgres/data.sql
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -c 'CREATE DATABASE stock_mcp OWNER root'
          psql -h 127.0.0.1 -U root -d stock_mcp -v ON_ERROR_STOP=1 -f stock-calculator-mcp-notify/src/main/resources/notify-schema.sql

      - name: 扩展虚拟内存 (Swap Space)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: 配置 GraalVM JDK 25 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: true

      - name: 编译 Native 二进制 (build-native.sh)
        env:
          POSTGRES_PASS: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
        run: bash stock-calculator-mcp-notify/build-native.sh

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 格式化镜像名称 (全小写)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-notify" >> $GITHUB_ENV

      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./stock-calculator-mcp-notify
          file: ./stock-calculator-mcp-notify/Dockerfile.native
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-notify
          cache-to: type=gha,mode=max,scope=docker-notify

  # ---------------- Orchestration 编排服务镜像（:18083，依赖 main artifact，需 PG） ----------------
  # 与 build-mcp 同套路（三表复用 stock_mcp 库，D6），差异点：
  #   - 镜像名加 -orchestration 后缀（ghcr.io/<repo>-orchestration）
  #   - GHA docker 缓存独立 scope（docker-orchestration）
  build-orchestration:
    name: 构建 Orchestration 服务镜像 (orchestration)
    needs: changes
    if: needs.changes.outputs.orchestration == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
          POSTGRES_DB: scs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化数据库 schema
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
        run: |
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -f postgres/schema.sql
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -f postgres/data.sql
          psql -h 127.0.0.1 -U root -d scs -v ON_ERROR_STOP=1 -c 'CREATE DATABASE stock_mcp OWNER root'
          psql -h 127.0.0.1 -U root -d stock_mcp -v ON_ERROR_STOP=1 -f stock-calculator-orchestration/src/main/resources/orchestration-schema.sql

      - name: 扩展虚拟内存 (Swap Space)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: 配置 GraalVM JDK 25 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: true

      - name: 编译 Native 二进制 (build-native.sh)
        env:
          POSTGRES_PASS: ${{ secrets.CI_POSTGRES_PASSWORD || 'zzh@scs.com' }}
        run: bash stock-calculator-orchestration/build-native.sh

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 格式化镜像名称 (全小写)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-orchestration" >> $GITHUB_ENV

      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./stock-calculator-orchestration
          file: ./stock-calculator-orchestration/Dockerfile.native
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-orchestration
          cache-to: type=gha,mode=max,scope=docker-orchestration



