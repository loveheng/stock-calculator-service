name: Build and Push Native Docker Image for Stock Calculator Service

on:
  push:
    branches: [ "main", "dev", "native" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # build-native.sh 步骤 4 的启动测试需要真实连库（EMF 初始化时 Hikari
    # 要拿连接探测方言），与本地 docker-compose 的 postgres 保持同版本同账号，
    # 应用侧零配置（application-postgres.yml 的默认值即 localhost/scs）。
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: zzh@scs.com
          POSTGRES_DB: scs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安全处理：将仓库名强制转为全小写，防止推送 GHCR 时大小写不合规报错
      - name: 格式化镜像名称 (全小写)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 3. 扩展 Runner 虚拟内存 (Swap Space)
      #    GitHub Runner 只有 7GB RAM，build-native.sh 里 native-image 用 -J-Xmx7g，
      #    增加 8GB Swap 确保编译不 OOM。
      - name: 扩展虚拟内存 (Swap Space)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      # 4. 配置 GraalVM JDK 25 环境（含 native-image 组件）
      #    build-native.sh 会自动探测 JAVA_HOME（setup-graalvm 会设置）并校验 25.x 版本。
      #    cache: 'maven' 缓存 ~/.m2，加快父 POM + common 的 install 与依赖下载。
      - name: 配置 GraalVM JDK 25 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: true

      # 5. 编译 Native 二进制 + 冒烟验证
      #    全部逻辑收敛在 build-native.sh（本地与 CI 走完全相同的路径）：
      #    install 父POM/common -> mvnw compile + spring-boot:process-aot
      #    -> 生成 classpath 并剥离 test jar -> native-image -> 启动测试（失败即中止）
      #    任一步骤失败脚本都会 exit 1，坏二进制不会进入镜像。
      - name: 编译 Native 二进制 (build-native.sh)
        run: bash stock-calculator-native/build-native.sh

      # 6. 登录 GitHub Container Registry (GHCR)
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. 解析镜像 Tag 和 Labels
      - name: 解析镜像 Tag 和 Label 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      # 8. 初始化 Docker Buildx
      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 9. 构建并推送最小镜像（Dockerfile.native 在 native 模块目录内，
      #    context 必须同为该目录，才能 COPY 到模块 target/ 下的二进制）
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./stock-calculator-native
          file: ./stock-calculator-native/Dockerfile.native
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-native
          cache-to: type=gha,mode=max,scope=docker-native
