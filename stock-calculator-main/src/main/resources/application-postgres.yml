spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost/scs}
    username: ${POSTGRES_USER:root}
    # 口令不落库：必须通过 POSTGRES_PASS 环境变量注入
    password: ${POSTGRES_PASS:}
  sql:
    init:
      # data.sql 默认数据播种（copilot prompt 模版等）：必须 always，否则外置 PG 默认不执行；
      # 脚本内 ON CONFLICT DO NOTHING 保证幂等（缺才插，不覆盖已有行）。回滚此行 = 停用播种。
      mode: always
