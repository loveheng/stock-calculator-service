spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost/scs}
    username: ${POSTGRES_USER:root}
    # 口令不落库：必须通过 POSTGRES_PASS 环境变量注入
    password: ${POSTGRES_PASS:}
  sql:
    init:
      # schema.sql/data.sql 打包在 classpath 根（pom resources，源文件 postgres/），
      # 启动时自动建表+播种，详见 application.yml 同节点注释。回滚此行 = 停用。
      mode: always
