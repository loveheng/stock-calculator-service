spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost/scs}
    username: ${POSTGRES_USER:root}
    # 口令不落库：必须通过 POSTGRES_PASS 环境变量注入
    password: ${POSTGRES_PASS:}
  sql:
    init:
      # schema.sql 位于本模块 resources 根（SSOT 随包，Boot 默认脚本位置），启动时幂等
      # 建表 + 灌全部种子（文件尾部播种区：pull_task_config + copilot prompt 模版；
      # 原 postgres/data.sql 已删除并入），详见 application.yml 同节点注释。
      # 回滚此行 = 停用。
      mode: always
