spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost/scs}
    username: ${POSTGRES_USER:root}
    # 口令不落库：必须通过 POSTGRES_PASS 环境变量注入
    password: ${POSTGRES_PASS:}
  sql:
    init:
      # schema.sql 位于本模块 resources 根（SSOT 随包，Boot 默认脚本位置），启动时幂等建表；
      # data.sql 已退化为纯记录（postgres/ 目录备档，不随包不执行），播种改 psql 手工
      # 执行（CI docker-image.yml 各 job 预灌），详见 application.yml 同节点注释。
      # 回滚此行 = 停用。
      mode: always
