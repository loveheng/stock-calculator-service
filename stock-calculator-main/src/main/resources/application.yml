server:
  port: 18080
  tomcat:
    # 限制内置 Tomcat 工作线程数（个人使用 10 个足够，默认 200 个会吃掉上百兆栈内存）
    threads:
      max: 10
      min-spare: 2
    # 限制连接与等待队列
    max-connections: 50
    accept-count: 20

spring:
  application:
    name: stock-calculator
  profiles:
    active: postgres
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 16
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  sql:
    init:
      # schema.sql + data.sql 由 pom resources 从 postgres/ 打包到 classpath 根
      # （即默认脚本位置），每次启动自动建表+播种（copilot prompt 模版等）；
      # 脚本幂等（IF NOT EXISTS / ON CONFLICT DO NOTHING，缺才插不覆盖已有行）；
      # 连接的库必须带 pgvector 扩展（schema.sql 会 CREATE EXTENSION vector）；
      # native 资源由 Boot SqlInitializationScriptsRuntimeHints 自动注册
      mode: always
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: stock-calculator-scheduler
  main:
    # 禁用 Spring 启动 Banner，微量减少启动开销
    banner-mode: "off"
    # 启用延迟初始化（按需加载 Bean，显著降低初始内存）
    lazy-initialization: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # JavaMail 默认无限等待；事务内发信（OtpService）遇 SMTP 挂起会无限占用
          # DB 连接直至拖垮连接池。值必须为整型毫秒（JavaMail 属性不认 5s 这种时长写法）。
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${SMTP_STARTTLS:true}
          # 465 隐式 SSL（如新浪 SMTP 仅 465 加密、587 为明文无 STARTTLS）：
          # .env 设 SMTP_SSL=true + SMTP_PORT=465 + SMTP_STARTTLS=false；与 starttls 互斥使用
          ssl:
            enable: ${SMTP_SSL:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 短超时：Redis 故障时快速降级（会话回源 DB、限流放行），不阻塞主链路
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    # 数据服务拆分终态（docs/architecture/data-service-split.md）：result 上行消费 + task/control 下发。
    # RabbitMQ 为数据管线的必要依赖：broker 不可用时监听器持续重连、发布失败由对账重发兜底（D6）；
    # 管线停摆经 PipelineWatchTask 告警（邮件），不再设进程内回退路径
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    # 关闭 Boot 自动 AmqpAdmin（RabbitAdmin 会在启动期声明拓扑而开连接）；
    # AmqpAdmin 由 RabbitTopologyConfig 提供
    dynamic: false
    # 任务发布需确认回调；当前仅 dead.q 投递使用
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 手动 ack（设计文档 §4.4）：业务成功/失败分流后由消费端显式确认
        acknowledge-mode: manual

crawler:
  # /api/admin/sync 管理端点令牌；未配置时端点拒绝所有请求
  admin-token: ${CRAWLER_ADMIN_TOKEN:}

vision:
  ocr:
    # 默认识别语言（OCR.space 语言码：chs=简体中文）
    language: chs
    # 图片哈希 -> 识别文本缓存（Redis，key=vision:ocr:text:<MD5>；命中直接返回节省免费额度，重启不清零）
    cache-ttl: 30m
    # 单渠道最大尝试次数与退避间隔（仅对 429/5xx/超时可重试异常生效）
    max-attempts: 2
    retry-backoff: 300ms
    azure:
      # 首选渠道：未申请 Azure AI Vision Key 时保持关闭，调度器健康检查自动跳过；
      # 启用时通过环境变量提供 endpoint 与订阅 Key（或直接改为此处的字面量）
      enabled: ${AZURE_OCR_ENABLED:true}
      endpoint: ${AZURE_OCR_ENDPOINT:https://zzhscsocr.cognitiveservices.azure.com/}
      api-key: ${AZURE_OCR_API_KEY:}
      api-version: "2024-02-01"
      connect-timeout: 5s
      read-timeout: 30s
      poll-interval: 500ms
      poll-max-times: 20
    ocrspace:
      # 备用渠道：免费额度 Key（环境变量 OCRSPACE_API_KEY 可覆盖默认值）
      enabled: true
      api-key: ${OCRSPACE_API_KEY:K82621831488957}
      url: https://api.ocr.space/parse/image
      engine: "2"
      connect-timeout: 5s
      read-timeout: 30s
  ai:
    # 智能图片分析门面：图片哈希 -> 交易草稿 AI 结果缓存（Redis，key=vision:ai:draft:<MD5>；命中零 OCR/LLM 消耗，useCache=false 时淘汰）
    result-cache-ttl: 30m

llm:
  # 链路内单渠道最大尝试次数：429 属 RPM/TPM 窗口限流，短退避重试无意义，默认 1 次即流转下一渠道
  max-attempts: 1
  retry-backoff: 300ms
  gemini:
    # 首选渠道（Gemini OpenAI 兼容端点）；Key/baseUrl 未配置时健康检查自动跳过
    enabled: ${LLM_GEMINI_ENABLED:true}
    base-url: https://generativelanguage.googleapis.com/v1beta/openai
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    read-timeout: 20s
  groq:
    # 备用渠道（Groq OpenAI 兼容端点，Llama 开源模型极速推理）；Key 未配置时健康检查自动跳过
    enabled: ${LLM_GROQ_ENABLED:true}
    base-url: https://api.groq.com/openai/v1
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    read-timeout: 20s
  fallback:
    # 兜底哑响应：不调用任何模型，明确告知降级；enabled=false 时全链失败抛 503
    enabled: ${LLM_FALLBACK_ENABLED:true}
    response: "[降级响应] AI 渠道暂不可用，本次结果未经模型处理，请稍后重试。"

copilot:
  enabled: true   # Copilot AI 功能总开关
  llm:
    deepseek:
      # Copilot 专用 DeepSeek 渠道；base-url 未配置时模型 Bean 不装配，ask 接口返回 503
      enabled: ${DEEPSEEK_ENABLED:true}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      # read-timeout 经 OpenAiChatOptions.timeout 映射为 OkHttp callTimeout（整次请求上限，含流式全程）；
      # callLlm 底层走 SSE 流式（中转渠道网关 60s 掐非流式），实测该渠道长文生成可达 253s，故放宽到 300s
      read-timeout: 300s
  memory:
    # 记忆固化链路（docs/copilot/memory-profile.md §十一 5）：enabled=false 时种子不发布、tick 丢弃，
    # 既有聊天行为零变化
    enabled: true
    # 轻量种子 per-message TTL（毫秒）＝ 合批窗：60s 内连发多轮仅 1 次提炼（tick 中转重算差量）
    seed-ttl-ms: 60000
    # 提炼在途锁超时兑底（毫秒）：在途任务丢失后放行重发；须小于 seed-ttl-ms（决策 #20）
    in-flight-timeout-ms: 30000
    # 差量片段截断（字符，决策 #11）；溯源保留条数（§四）
    snippet-max-chars: 2000
    source-ids-keep: 20
    # 画像触发：ΔCount 阈值（决策 #18）；输入治理 Top-M 与权重衰减（决策 #17）
    profile-delta-threshold: 3
    profile-top-m: 4
    profile-weight-decay: 0.25
    # 稀疏冷启动护栏（决策 #22）：active 条数低于此值时推断类特征强制空
    profile-sparse-guard-min: 3
    # 注入预算族（字符，§七）：每轮聊天恒定成本，总封顶 ≈ 6.1k
    recall:
      profile-budget: 800
      pinned-budget: 1200
      memory-budget: 2000
      recent-budget: 2000
      recent-days: 3
      top-n: 20
      pinned-max: 10

app:
  auth:
    # E2EE 用户服务总开关：native 变体的 application.yml 不配置此项，即整体关闭
    enabled: true

embedding:
  # 向量化功能总开关（cls_article 语义检索基座，docs/ai-pipeline/cls-article-vector.md）
  # 运行期门控（EmbeddingGate，R1）：enabled=true 且 CF 凭据齐备才实例化重 Bean；
  # 未配置凭据时整体关闭并 WARN 一次（native/JVM 行为一致）
  enabled: ${EMBEDDING_ENABLED:true}
  cloudflare:
    # CF 账户 ID + Workers AI 专用 token（仅 Workers AI Edit 权限，须为轮换后新 token，§8.1）
    # 口令不落库，同 POSTGRES_PASS 模式经环境变量注入
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_API_TOKEN:}
    model: ${CLOUDFLARE_MODEL:'@cf/baai/bge-m3'}
    dimensions: 1024
  # 单日回填上限（免费额度 10000 Neurons/日，00:00 UTC 刷新；bge-m3 计价实测 1075 Neurons/M tokens，
  # 均值 ~115 tokens/条 → 60000 条/天 ≈ 75%~84% 额度；留 ~20% 防回填打爆当日额度
  # 导致增量监听/聊天查询向量化连坐 429，§5.3）
  daily-max-articles: 60000
  # 永久性失败连续次数上限：达上限落 FAILED 终态退出游标（仅 PERMANENT 计次，成功清零）
  max-fail-attempts: 5
  backfill:
    # 回填对账总开关（startup/DB 调度都停；E2E 共享 broker 场景必关，防扫真实库发任务污染测试队列）
    enabled: true
    startup-delay: 15s
  # 统计报告邮件（新增数据量 + 存量处理量；存量完成后仅报增量，§9.3）
  # 每日 UTC 01:00（北京 09:00）检查点比对上次发送，满 interval-days 才发；
  # 收件人复用 EMBEDDING_NOTIFY_EMAIL，未配置时静默跳过
  report:
    enabled: true
    interval-days: 3
  search:
    default-top-k: 10
    default-threshold: 0.5

# ======================= announcement 域（docs/ai-pipeline/announcement-rag.md §7） =======================
# 定时调度已迁 pull_task_config 表 CALENDAR 行（job.announcement.process / job.announcement.snapshot，改库即生效）
announcement:
  process:
    max-fail-attempts: 3
    # RATE_LIMITED 上报后暂停任务发布的冷却窗口（分钟，§4.5 发布端熔断）
    rate-limit-cooldown-minutes: 30
  subscription:
    # 每用户订阅标的数上限（防滥用：订阅即触发 CNINFO 全量首拉）
    max-per-user: 100
  pdf:
    # 超体积终态判定阈值（result.announcement.collected 消费端）
    max-size-mb: 50

# ======================= kg 域（docs/ai-pipeline/cls-news-kg.md §7） =======================
# 调度走 pull_task_config CALENDAR 行（job.kg.extract，改库即生效，代码零定时器）
kg:
  digest:
    # 汇编稿标题关键字（title LIKE %kw%；content 匹配有噪音，勿改用 content 口径）
    title-keyword: 《新闻联播》要闻
    # 每轮最多下发任务数（每天产 1 条，3 = 3 天追赶窗口，覆盖断档自愈）
    dispatch-limit: 3
    # 候选扫描窗口倍数（scan = dispatch-limit * multiplier，为未终态过滤留余量）
    scan-multiplier: 3
  process:
    # 瞬时失败计次上限，达限落 FAILED 终态
    max-fail-attempts: 5
    # RATE_LIMITED 上报后暂停任务发布的冷却窗口（分钟，发布端熔断）
    rate-limit-cooldown-minutes: 30
  backfill:
    # 历史回填总开关（startup/DB 调度两条触发路径都停；E2E 共享 broker 场景必关）
    enabled: true
    # 每轮最多下发任务数（1114 条存量最旧优先分批；每 30 分钟一轮 × 20 ≈ 1.2 天追平）
    batch-size: 20
    # 回填扫描窗口倍数（scan = batch-size * multiplier，为未终态过滤留余量）
    scan-multiplier: 3
    # 启动后延迟触发首轮回填（与 DB 调度互补，单飞守卫防重叠）
    startup-delay: 15s

# ======================= search 域（docs/news-search/implementation.md §9） =======================
# 默认值 = 拍板值（B6 限流 10 次/10s + 综合 3 次/10s；C11 threshold=0.3/topK=10），显式落配置便于调参
search:
  rate-limit:
    search-window-seconds: 10
    search-max-per-window: 10
    composite-max-per-window: 3
  retrieval:
    default-top-k: 10
    max-top-k: 50
    default-threshold: 0.3
    # 公告向量 metadata 下推门控：false = 过渡期（B8 前存量行缺 annDate）——secCode 恒下推
    # （metadata 首版即有），annDate/近窗不下推，走回查内存过滤 + 召回深度 ×4 补偿；
    # true = 回填完成后 annDate 区间下推 + 无 dateRange 时近窗两段式（与 cls 同款）
    kind-filter-enabled: false
    # cls 检索近窗优先（ctime 下推 SQL）：无 dateRange 时第一段召回窗口（天），
    # 不足 topK 且回落开启时全量向量检索补齐；dateRange 恒为硬下推闭区间
    recent-window-days: 30
    full-corpus-fallback: true
    # 短查询路由兜底线：无空格且 ≤ 此长度走关键词精确路径（电报 content LIKE / 公告
    # title·summary·secName·secCode LIKE，pg_trgm GIN）；主判据是代码/股票/题材字典命中
    # （ClsArticleQueryApi.isEntityLikeQuery，电报/公告共用），0 命中回落向量
    short-query-max-chars: 4
  composite:
    llm-timeout-seconds: 30
    retrieval-top-k: 8
  # backfill 回填任务调度已迁 pull_task_config CALENDAR 行（job.search.backfill，默认停用）

# ======================= pipeline 管线巡检告警（docs/architecture/data-service-split.md R4） =======================
# MQ 单路径终态后无回退开关：数据服务停机/队列积压/毒消息/PENDING 停滞经本任务定期巡检，
# 触发即发邮件（PIPELINE_ALERT_EMAIL 未配置时静默）；同类告警带冷却窗口，防风暴。
pipeline:
  watch:
    # 巡检调度已迁 pull_task_config 表 CALENDAR 行（job.pipeline.watch，改库即生效）
    # LavinMQ/RabbitMQ 管理 API（队列深度与 consumer 数查询；凭据复用 AMQP 账号）
    mgmt-base-url: ${RABBIT_MGMT_URL:http://localhost:15672}
    mgmt-username: ${RABBIT_USER:guest}
    mgmt-password: ${RABBIT_PASS:guest}
    vhost: /
    # 任务/结果队列积压告警阈值（条）
    queue-backlog-threshold: 100
    # DB 侧 PENDING 最老年龄告警阈值（小时）
    max-pending-age-hours: 24
    # 同类告警冷却窗口（分钟）
    alert-cooldown-minutes: 30
