server:
  port: 18080
  tomcat:
    # 限制内置 Tomcat 工作线程数（个人使用 10 个足够，默认 200 个会吃掉上百兆栈内存）
    threads:
      max: 10
      min-spare: 2
    # 限制连接与等待队列
    max-connections: 50
    accept-count: 20

spring:
  application:
    name: stock-calculator
  profiles:
    active: postgres
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 16
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  ai:
    openai:
      api-key: ${GEMINI_API_KEY:dummy-gemini-key}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-3.6-flash
          temperature: 0.0
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=300,expireAfterWrite=24h
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: stock-calculator-scheduler
  main:
    # 禁用 Spring 启动 Banner，微量减少启动开销
    banner-mode: "off"
    # 启用延迟初始化（按需加载 Bean，显著降低初始内存）
    lazy-initialization: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

crawler:
  enabled: true
  # /api/admin/sync 管理端点令牌；未配置时端点拒绝所有请求
  admin-token: ${CRAWLER_ADMIN_TOKEN:}

app:
  auth:
    # E2EE 用户服务总开关：native 变体的 application.yml 不配置此项，即整体关闭
    enabled: true
