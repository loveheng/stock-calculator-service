server:
  port: 18081
spring:
  application:
    name: stock-calculator-data
  main:
    # 阶段 5 起暴露 ingest HTTP 端点（docs/architecture/data-source-onboarding.md），需内嵌 web 服务器；
    # 测试仍显式 web-application-type=none 保持零端口依赖
    banner-mode: "off"
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    # 发布端确认（设计文档 §4.4）：correlated 模式 + MqPublishConfig 回调日志
    publisher-confirm-type: correlated
    publisher-returns: true

datasvc:
  # collector 拉取面总开关（阶段 3 引入）：v2.5 单镜像多副本后生产恒 true，多副本
  # 拉取靠种子+深度守卫自愈收敛（原「副本恒=1」打包约束随 worker 变体一并退役）
  collector:
    enabled: ${COLLECT_ENABLE:false}
    announcement:
      # 公告采集（§8 阶段 4 任务 2）：叠加在 collector.enabled 之上的域开关；
      # 标的源 = 订阅快照（control.subscription.snapshot，首帧到达前空转）
      enabled: true
      # 公告类型不区分（决策 2026-09-18）：空 = 全部类型全采（clsreflush.json 共 26 类；
      # S3 实证：仅显式传 category 才过滤，勿在此配置具体类型）
      category: ''
      first-pull-mode: FULL
      history-since: 2023-01-01
      lookback-days: 90
      long-term-enabled: false
      long-term-keywords: '招股说明书,公司章程,重大资产重组,控制权变更'
      throttle-batch-interval-ms: 300
      max-pages: 200
      page-size: 30
      pdf-max-size-mb: 50
  # worker 计算面总开关（阶段 3 引入）：v2.5 单镜像多副本后生产恒 true，「恰一个」
  # 单消费者语义由 MQ 协议仲裁（task.history.sync SAC + 种子自愈）；仅测试装配隔离
  # 时置 false；AOT 固化条件装配（R1 教训，collector 同），native 变更需重建
  worker:
    enabled: ${WORKER_ENABLE:false}
    prefetch:
      # 公告监听器并发消费者数（默认 1=原行为；运行期 env 可覆盖，值非 AOT 条件）
      announcement-concurrency: 1
    embedding:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
  # 公告蒸馏 LLM（阶段 4 任务 4）：单渠道 OpenAI 兼容；worker.enabled=false 时不校验
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    max-tokens: ${DATASVC_LLM_MAX_TOKENS:}
  # webhook 摄取端点（阶段 5）：默认关闭；部署经 DATASVC_INGEST_ENABLED=true +
  # INGEST_SECRET 开启（HMAC-SHA256 共享密钥，见 docs/architecture/data-source-onboarding.md）
  ingest:
    enabled: false
    secret: ${INGEST_SECRET:}
    skew-seconds: 300
  # MQ 心跳 watchdog（多副本改造）：连接假死检测 + 心跳文件（Dockerfile.native HEALTHCHECK
  # 读 mtime）；连续失败达阈值主动退出，交由容器 restart 策略自愈。见 MqHeartbeatWatchdog
  heartbeat:
    enabled: true
    interval-ms: 60000
    timeout-ms: 10000
    failure-threshold: 3
    file: /tmp/datasvc-heartbeat
  # 常态拉取自循环（docs/architecture/pull-loop-unification.md）：代码默认值兜底，
  # control.pull.config 快照可覆盖；仅 collector 门控实例生效
  pullloop:
    cls:
      enabled: true
      ttl-ms: 480000
    announcement:
      enabled: true
      ttl-ms: 3600000

logging:
  level:
    root: info
