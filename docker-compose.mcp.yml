# MCP 层：mcp 经纪人(:18081) / notify 提醒(:18082) / orchestration 编排(:18083)。
# 依赖中间件层（docker-compose.middleware.yml 提供 postgres / redis / lavinmq），
# 与应用层 docker-compose.app.yml 同款约定：
#   - 启动顺序：先中间件，后本层；均 restart: unless-stopped，中间件晚起可自愈重连，
#     故不写 depends_on（compose 跨项目无法引用另一文件的服务）。
#   - 互通：加入中间件层创建的固定名网络 scs-net（external，仅加入不创建），
#     经服务名 postgres / redis / lavinmq 做 DNS 访问，.env 中的
#     POSTGRES_URL_MCP / RABBIT_HOST 等无需改动。
#   - 若本机不跑中间件，先执行：docker network create scs-net
#   - 文件名不是 compose 默认名，所有命令需 -f 显式指定：
#       docker compose -f docker-compose.mcp.yml up -d
services:
  # MCP 经纪人（CI 推送的 GraalVM Native 镜像，镜像名 = 主镜像 + -mcp 后缀）。
  # 连 stock_mcp 独立库（POSTGRES_URL_MCP）+ redis（REDIS_HOST）；
  # CLOUDFLARE_* / OPENAI_MINI_*（persona 提炼）经 env_file 从 .env 注入。
  mcp:
    image: ghcr.io/loveheng/stock-calculator-service-mcp:${MCP_IMAGE_TAG:-latest}
    ports:
      - "${MCP_PORT:-18081}:18081"
    env_file:
      - .env
    restart: unless-stopped
    # 就绪探针：podman-compose 不继承镜像内置 HEALTHCHECK（Dockerfile 那份只用于 docker compose
    # / podman 直接 run），此处必须显式重写；-f 必需——不带 -f 时 404 也算成功，退化成端口探活，
    # 而 orchestration 需要的是「工具面已装配」，不是「端口已 listen」。
    healthcheck:
      test: ["CMD", "curl", "-fs", "-m", "3", "http://localhost:18081/internal/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "k8s-file"
      options:
        path: "/tmp/scs-mcp.log"
        max-size: "20mb"
        max-file: "5"
    networks:
      scs-net:
        # 显式别名：orchestration 的 MCP_BROKER_URL 经服务名 mcp 解析到本容器
        aliases: [mcp]

  # Notify 提醒服务（镜像名 = 主镜像 + -notify 后缀）。
  # reminder 表复用 stock_mcp 独立库（N3），依赖 postgres + lavinmq；
  # SMTP_* 等发信凭据经 env_file 从 .env 注入。
  notify:
    image: ghcr.io/loveheng/stock-calculator-service-notify:${NOTIFY_IMAGE_TAG:-latest}
    ports:
      - "${NOTIFY_PORT:-18082}:18082"
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "k8s-file"
      options:
        path: "/tmp/scs-notify.log"
        max-size: "20mb"
        max-file: "5"
    networks:
      - scs-net

  # Orchestration 编排服务（镜像名 = 主镜像 + -orchestration 后缀）。
  # 三表复用 stock_mcp 独立库（D6），依赖 postgres + lavinmq；
  # Planner 的 OPENAI_MAX_* 三键、意图向量 CLOUDFLARE_* 两键、
  # 服务级通行证 ORCH_PASSPORT_TOKEN 均经 env_file 从 .env 注入。
  # Executor 的 mcp 经纪人地址：容器内走 scs-net 服务名 mcp（非 .env 的 localhost），
  # 如经纪人不在本机 scs-net 上，在 .env 里覆盖 MCP_BROKER_URL 即可。
  #
  # 【启动顺序：必须晚于 mcp 就绪】McpSyncClient 在 bean 创建期连 MCP_BROKER_URL 做 SSE
  # initialize，mcp 未起则 ~20s 超时直接 BeanCreationException 炸启动。三重保险：
  #   1) entrypoint 前置等待：轮询 mcp /internal/ready 最长 120s，就绪才起二进制
  #      （不依赖 compose 能力，podman-compose 各版本都生效，是主力手段）；
  #   2) depends_on.condition: service_healthy：新版 podman-compose/docker compose 生效，
  #      低版本可能忽略 condition 仅保证创建顺序——故不能只靠它；
  #   3) restart: unless-stopped：极端情况（mcp 起不来 / 等待窗口超时）首次启动失败后
  #      由重启自愈，mcp 恢复后必然拉起。
  # 等待窗口用完即放行而非无限阻塞：宁可让应用起失败重启，也不要卡在「永远起不来」。
  orchestration:
    image: ghcr.io/loveheng/stock-calculator-service-orchestration:${ORCHESTRATION_IMAGE_TAG:-latest}
    ports:
      - "${ORCHESTRATION_PORT:-18083}:18083"
    environment:
      - MCP_BROKER_URL=${MCP_BROKER_URL:-http://mcp:18081/sse}
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        # 就绪 URL：从 MCP_BROKER_URL 取 scheme://host:port（SSE transport 路径各异，删尾不稳）
        BROKER_READY_URL="$$(printf '%s' "$${MCP_BROKER_URL:-http://mcp:18081/sse}" | sed -E 's#^([a-zA-Z]+://[^/]+).*#\1#')/internal/ready"
        i=0
        until curl -fs -m 3 "$$BROKER_READY_URL" >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -ge 60 ]; then
            echo "orchestration: 等待 mcp 就绪超时(120s)，先行启动，失败由 restart 自愈" >&2
            break
          fi
          sleep 2
        done
        exec /application/stock-mcp-orchestration-service
    depends_on:
      mcp:
        condition: service_healthy
    # 仅存活探活（本服务无下游依赖方断言就绪）：不加 -f，避免根路径 404 被误判 unhealthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-m", "3", "-o", "/dev/null", "http://localhost:18083/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "k8s-file"
      options:
        path: "/tmp/scs-orchestration.log"
        max-size: "20mb"
        max-file: "5"
    networks:
      - scs-net

networks:
  # 中间件层已创建（见 docker-compose.middleware.yml 的 networks 段），此处仅加入
  scs-net:
    external: true
