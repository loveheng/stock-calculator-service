# stock-calculator-jpa 自带 native-image 配置
# 位于 META-INF/native-image/com.zzh/jpa-config/，与同目录 reachability-metadata.json /
# resource-config.json 一并被 native-image 自动探测合并；消费模块依赖本库即继承，无需在各自
# build-native.sh 重复声明（docs/architecture/jpa-native-extraction.md P1 / B2）。
#
# Args 仅放跨模块通用且安全的 -H: 开关；模块特定开关仍留在各自 build-native.sh。
# -H:+ReportExceptionStackTraces：JPA native 启动失败常因缺注册而只报截断栈，开启完整栈便于定位
#   （生产镜像如要极简可去掉此行）。
Args = \
  -H:+ReportExceptionStackTraces
