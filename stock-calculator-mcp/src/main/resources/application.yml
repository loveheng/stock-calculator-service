spring:
  application:
    name: stock-mcp
  datasource:
    # 独立库 stock_mcp（D2）：与主库 scs 同实例不同库；变量名带 _MCP 后缀，
    # 防止 .env 里指向主库的 POSTGRES_URL 误伤本模块；口令同实例复用 POSTGRES_PASS
    url: ${POSTGRES_URL_MCP:jdbc:postgresql://localhost/stock_mcp}
    username: ${POSTGRES_USER_MCP:root}
    # 口令不落库：必须通过 POSTGRES_PASS 环境变量注入
    password: ${POSTGRES_PASS:}
  data:
    redis:
      # 变量名与 main 同款（.env 的 REDIS_HOST=redis 经 /etc/hosts 127.0.0.1 映射可用）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 字典为旁路设施：故障快速失败走 fail-open 降级，不拖启动
      connect-timeout: 2s
      timeout: 2s
  sql:
    init:
      # mcp-schema.sql（kb 两表 + vector 扩展）每次启动幂等执行；回滚此行 = 停用
      mode: always
      schema-locations: classpath:mcp-schema.sql
  jpa:
    hibernate:
      # 库表以 sql.init 为准，validate 保持实体↔DDL 账实对齐（main 同款审计口径）
      ddl-auto: validate
  mvc:
    async:
      # SSE 服务端（WebMvcSseServerTransportProvider）永不超时：Tomcat 异步请求默认 30s 绝对计时，
      # 到点掐断 SSE 并移除会话，客户端（orchestration）下次调用即 404 Session not found，
      # 且 MCP SDK 客户端无自动重连（2026-09-24 实证）
      request-timeout: 0
  ai:
    mcp:
      server:
        name: stock-mcp
        version: 0.0.1
        # SSE 心跳：默认 null 不发保活，空闲连接易被中间层/容器回收
        keep-alive-interval: 15s

server:
  port: 18081

# 本地书库知识检索（kb RAG，design.md §八）
# embedding tier：供应商可切换（provider: cloudflare | openai），kb 灌书/检索经此取凭据
ai:
  embeddings:
    embed:
      provider: cloudflare
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
      model: ${CLOUDFLARE_MODEL:@cf/baai/bge-m3}
      dimensions: 1024
# LLM chat tier（stock-calculator-llm 组件）：persona 提炼离线调用（M2），
# 提炼属廉价批量 = openai-mini 档；KbLlmClient 原生 REST 三键从该 tier 读
# （env 用 OPENAI_MINI_* 三键）
  tiers:
    openai-mini:
      base-url: ${OPENAI_MINI_BASE_URL:}
      api-key: ${OPENAI_MINI_API_KEY:}
      model: ${OPENAI_MINI_MODEL:deepseek-chat}
kb:
  rss:
    # RSS 订阅源轮询（M1b）：默认 6h 一轮、启动 1min 后首拉；本地自用无更密需求
    poll-enabled: true
    poll-fixed-delay-ms: 21600000
    poll-initial-delay-ms: 60000
  ingest:
    # 离线灌书开关：默认关；启用需同时给 path/title（见 KbIngestProperties javadoc）
    enabled: false
    path: ''
    title: ''
    author: ''
    category: ''
